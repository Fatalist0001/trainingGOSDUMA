# config/features.yaml
# Определение групп признаков для ablation experiments

feature_groups:
  ELECTORAL_ONLY:
    description: "Только электоральные признаки (предыдущие выборы, явка, президентские)"
    include_patterns:
      - "*_share"
      - "*_share_lag1"
      - "turnout_rate"
      - "turnout_rate_lag1"
      - "leading_candidate_share"
      - "leading_candidate_share_lag1"
      - "pres_turnout_lag"
      - "pres_leading_candidate_share_lag"
    exclude_patterns:
      - "population_"
      - "GRP_"
      - "average_salary_"
      - "unemployment_"
      - "poverty_"
      - "urban_population_"
      - "real_disposable_income_"
      - "age_working_"
      - "birth_rate_"
      - "death_rate_"
      - "natural_population_growth_"
      - "migration_rate_"
      - "doctors_per_1000_"
      - "hospital_beds_per_1000_"
      - "housing_area_per_capita_"

  ROSSTAT_ONLY:
    description: "Только социально-экономические признаки Росстата (лаг 1)"
    include_patterns:
      - "population_lag1"
      - "GRP_per_capita_lag1"
      - "average_salary_lag1"
      - "unemployment_rate_lag1"
      - "poverty_rate_lag1"
      - "urban_population_share_lag1"
      - "real_disposable_income_lag1"
      - "age_working_share_lag1"
      - "birth_rate_lag1"
      - "death_rate_lag1"
      - "natural_population_growth_lag1"
      - "migration_rate_lag1"
      - "doctors_per_1000_lag1"
      - "hospital_beds_per_1000_lag1"
      - "housing_area_per_capita_lag1"
    exclude_patterns:
      - "*_share"
      - "turnout_rate"
      - "leading_candidate_share"

  ALL_FEATURES:
    description: "Все доступные признаки (электоральные + Росстат)"
    include_patterns: ["*"]
    exclude_patterns:
      - "region_id"
      - "region_name"
      - "year"
      - "type"
      - "election_id"
      - "tik"
      - "uik"
      - "electorate"
      - "turnout"
      - "valid"
      - "invalid"
      - "turnout_early"
      - "turnout_online"
      - "turnout_offsite"
      - "turnout_onsite"
      - "turnout_absentee"
      - "leading_candidate"
      - "leading_candidate_votes"
      - "Putin"
      - "Zyuganov"
      - "Zhirinovsky"
      - "Yavlinskiy"
      - "Tuleev"
      - "Pamfilova"
      - "against_all"
      - "Kharitonov"
      - "Malyshkin"
      - "Glazyev"
      - "Khakamada"
      - "Mironov"
      - "Medvedev"
      - "Bogdanov"
      - "Prokhorov"
      - "Grudinin"
      - "Sobchak"
      - "Titov_B"
      - "Suraykin"
      - "Baburin"
      - "Slutsky"
      - "Davankov"
      - "UR"
      - "KPRF"
      - "LDPR"
      - "SR"
      - "NovyeLyudi"
      - "target_*"

# Целевые переменные (читаются динамически из данных)
targets:
  region_level:
    - "UR_share"
    - "KPRF_share"
    - "LDPR_share"
  precinct_level:
    - "UR_share"
    - "KPRF_share"
    - "LDPR_share"
    - "SR_share"
    - "NovyeLyudi_share"

# Признаки, которые НЕЛЬЗЯ использовать (leakage risk)
forbidden_features:
  - "region_id"
  - "region_name"
  - "election_id"
  - "tik"
  - "uik"
  - "precinct_id"
  - "target_*"