# config/models.yaml
# Сетки гиперпараметров для каждого класса модели
# Используются в RandomizedSearch / Optuna

models:
  # P0 Baselines (no hyperparameters)
  NaivePreviousElection: {}
  HistoricalMean: {}
  WeightedHistoricalMean:
    decay_schemes: ["exponential", "linear"]
    max_history_years: 5

  # Linear models
  LinearRegression: {}

  Ridge:
    alpha: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
    solver: ["auto", "svd", "cholesky", "lsqr", "sparse_cg", "sag", "saga"]
    max_iter: [1000, 5000]

  ElasticNet:
    alpha: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
    l1_ratio: [0.1, 0.3, 0.5, 0.7, 0.9, 0.95, 0.99]
    max_iter: [2000, 5000]
    selection: ["cyclic", "random"]

  # Tree models
  RandomForest:
    n_estimators: [200, 500, 1000]
    max_depth: [5, 10, 15, 20, null]
    min_samples_split: [2, 5, 10]
    min_samples_leaf: [1, 2, 4]
    max_features: ["sqrt", "log2", 0.5, 0.7]
    bootstrap: [true]

  HistGradientBoosting:
    learning_rate: [0.01, 0.05, 0.1, 0.2]
    max_iter: [200, 500, 1000]
    max_depth: [3, 5, 7, 10, null]
    min_samples_leaf: [10, 20, 30, 50]
    l2_regularization: [0.0, 0.1, 1.0, 10.0]
    max_bins: [255]
    early_stopping: [true]
    validation_fraction: [0.15]

  XGBoost:
    n_estimators: [200, 500, 1000, 2000]
    max_depth: [3, 5, 7, 10]
    learning_rate: [0.01, 0.05, 0.1, 0.2]
    subsample: [0.6, 0.8, 1.0]
    colsample_bytree: [0.6, 0.8, 1.0]
    min_child_weight: [1, 3, 5, 10]
    reg_alpha: [0.0, 0.1, 1.0, 10.0]
    reg_lambda: [0.0, 0.1, 1.0, 10.0]
    objective: ["reg:squarederror"]
    tree_method: ["hist"]
    early_stopping_rounds: [50]

  CatBoost:
    iterations: [500, 1000, 2000]
    depth: [4, 6, 8, 10]
    learning_rate: [0.01, 0.03, 0.05, 0.1]
    l2_leaf_reg: [1, 3, 5, 10, 20]
    loss_function: ["RMSE"]
    early_stopping_rounds: [50]
    verbose: [false]
    random_seed: [42]

  # KNN
  KNN:
    n_neighbors: [3, 5, 7, 10, 15, 20]
    weights: ["uniform", "distance"]
    metric: ["euclidean", "manhattan", "chebyshev"]
    p: [1, 2]

  # Neural models
  MLPSklearn:
    hidden_layer_sizes:
      - [256, 128, 64]
      - [128, 64, 32]
      - [256, 128]
      - [512, 256, 128]
    activation: ["relu", "tanh"]
    alpha: [0.0001, 0.001, 0.01, 0.1]
    learning_rate_init: [0.001, 0.01]
    max_iter: [500, 1000]
    early_stopping: [true]
    validation_fraction: [0.15]
    random_state: [42, 123, 456, 789, 2026]

  MLPTorch:
    hidden_sizes:
      - [256, 128, 64]
      - [128, 64, 32]
      - [256, 128]
    dropout: [0.1, 0.2, 0.3, 0.5]
    learning_rate: [0.001, 0.003, 0.01]
    weight_decay: [0.0, 1e-5, 1e-4, 1e-3]
    batch_size: [32, 64, 128, 256]
    epochs: [100, 200, 500]
    patience: [20, 30]
    seeds: [42, 123, 456, 789, 2026]

  # Temporal models
  GRU:
    hidden_size: [32, 64, 128]
    num_layers: [1, 2]
    dropout: [0.1, 0.2, 0.3]
    learning_rate: [0.001, 0.005, 0.01]
    batch_size: [16, 32, 64]
    epochs: [100, 200]
    patience: [20]
    seq_len: [3, 4, 5, 6]
    seeds: [42, 123, 456]

  LSTM:
    hidden_size: [32, 64, 128]
    num_layers: [1, 2]
    dropout: [0.1, 0.2, 0.3]
    learning_rate: [0.001, 0.005, 0.01]
    batch_size: [16, 32, 64]
    epochs: [100, 200]
    patience: [20]
    seq_len: [3, 4, 5, 6]
    seeds: [42, 123, 456]

  Transformer:
    d_model: [64, 128]
    n_heads: [4, 8]
    num_layers: [2, 3]
    dim_feedforward: [128, 256]
    dropout: [0.1, 0.2]
    learning_rate: [0.0005, 0.001, 0.005]
    batch_size: [16, 32]
    epochs: [100, 200]
    patience: [20]
    seq_len: [3, 4, 5, 6]
    seeds: [42, 123, 456]

  # Ensemble
  WeightedEnsemble:
    # Веса подбираются на validation
    optimization_method: "nelder-mead"  # or "differential_evolution"
    max_iter: 1000

  StackingEnsemble:
    meta_model: "Ridge"
    meta_model_params:
      alpha: [0.01, 0.1, 1.0, 10.0]
    cv_folds: 5

# Настройки поиска гиперпараметров
search:
  method: "random"  # "random" или "optuna"
  n_iter: 50
  cv_folds: 3
  scoring: "neg_mean_absolute_error"
  n_jobs: -1
  random_state: 42

optuna:
  n_trials: 100
  timeout: 3600  # seconds
  sampler: "TPESampler"
  pruner: "MedianPruner"
  direction: "minimize"