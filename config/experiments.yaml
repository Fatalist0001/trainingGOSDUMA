# config/experiments.yaml
# Определение временных сплитов для rolling backtest
# Годы читаются из metadata/elections.csv (parliamentary elections)
#
# ВАЖНО (методология, см. AGENTS.md):
#   * val и test НИКОГДА не пересекаются: validation год находится строго внутри
#     прошлого относительно test. val используется ТОЛЬКО для выбора гиперпараметров
#     и early stopping; модель, оцениваемая на test, дообучается на train+val.
#   * A: train 2003-2007 -> val 2011 -> test 2016
#   * B: train 2003-2011 -> val 2016 -> test 2021
#   * C/D: финальный прогноз 2026 (нет ground truth), val пуст.

experiments:
  A:
    name: "Experiment A"
    description: "Train: 2003-2007, Val: 2011, Test: 2016"
    train_years: [2003, 2007]
    val_years: [2011]
    test_years: [2016]
    election_type: "parl"

  B:
    name: "Experiment B"
    description: "Train: 2003-2011, Val: 2016, Test: 2021"
    train_years: [2003, 2007, 2011]
    val_years: [2016]
    test_years: [2021]
    election_type: "parl"

  C:
    name: "Experiment C"
    description: "Train: 2003-2021, Test: 2026 (final prediction, no ground truth)"
    train_years: [2003, 2007, 2011, 2016, 2021]
    val_years: []
    test_years: [2026]
    election_type: "parl"

  D:
    name: "Experiment D"
    description: "Train: all historical, Target: 2026 (final prediction)"
    train_years: [2003, 2007, 2011, 2016, 2021]
    val_years: []
    test_years: [2026]
    election_type: "parl"
    is_final: true