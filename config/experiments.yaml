# config/experiments.yaml
# Определение временных сплитов для rolling backtest
# Годы читаются из metadata/elections.csv (parliamentary elections)

experiments:
  A:
    name: "Experiment A"
    description: "Train: 2003-2011, Test: 2016"
    train_years: [2003, 2007, 2011]
    val_years: [2016]
    test_years: [2016]
    election_type: "parl"

  B:
    name: "Experiment B"
    description: "Train: 2003-2016, Test: 2021"
    train_years: [2003, 2007, 2011, 2016]
    val_years: [2021]
    test_years: [2021]
    election_type: "parl"

  C:
    name: "Experiment C"
    description: "Train: 2003-2021, Test: 2026 (final prediction, no ground truth)"
    train_years: [2003, 2007, 2011, 2016, 2021]
    val_years: []
    test_years: [2026]
    election_type: "parl"

  D:
    name: "Experiment D"
    description: "Train: all historical, Target: 2026 (final prediction)"
    train_years: [2003, 2007, 2011, 2016, 2021]
    val_years: []
    test_years: [2026]
    election_type: "parl"
    is_final: true

# Параметры для внутренней валидации (hyperparameter tuning)
internal_validation:
  val_split_ratio: 0.2
  min_train_years: 3
  # Для temporal models: используем более старые годы как validation
  temporal_val_years:
    A: [2012]
    B: [2016]
    C: [2018]
    D: [2021]