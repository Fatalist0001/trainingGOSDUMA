[project]
name = "trainingGOSDUMA"
version = "0.1.0"
description = "Воспроизводимый ML-эксперимент по прогнозированию результатов выборов в ГД РФ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "catboost>=1.2",
    "xgboost>=2.1",
    "torch>=2.3",
    "shap>=0.44",
    "optuna>=4.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
]
mlflow = ["mlflow>=2.15"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "leakage: leakage detection tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "W", "UP", "B", "C4", "SIM", "RUF",
]
ignore = [
    "E501", "B008",
    "N803", "N806", "N802",
    "TRY003",
    "PLC0415", "PLC0105",
    "E402",
    "PLR2004", "PLR0913", "PLR0917", "PLR0912", "PLR0915",
    "ARG002",
    "PTH123", "PTH100", "PTH118", "PTH120",
    "SIM108", "SIM102",
    "RUF059", "RUF005",
    "C405", "C401",
    "B905", "B007", "B006",
]
per-file-ignores = { "tests/*" = ["S101"], "scripts/*" = ["S101", "T201"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
files = ["src", "scripts", "tests"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"